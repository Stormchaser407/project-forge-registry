name: Cerberus policy migration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Remove remaining name-based Cerberus gates
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          def replace_method(path: str, method: str, replacement: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              pattern = rf"\n    def {re.escape(method)}\(.*?(?=\n    def |\n\nif __name__)"
              updated, count = re.subn(pattern, "\n" + replacement.rstrip(), text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: method {method} match count {count}")
              p.write_text(updated, encoding="utf-8")

          replace_once(
              "src/project_forge_registry/obsidian_mirror_generation.py",
              '    if record.slug == "cerberus" or "cerberus" in record.slug or "cerberus" in record.local_path.lower():\n        reasons.append("cerberus_protected")\n',
              '',
          )

          replace_once(
              "src/project_forge_registry/export_sync.py",
              '    slug_lower = record.slug.lower()\n    local_path_lower = record.local_path.lower()\n\n',
              '',
          )
          replace_once(
              "src/project_forge_registry/export_sync.py",
              '    if slug_lower == "cerberus" or "cerberus" in slug_lower or "cerberus" in local_path_lower:\n        reasons.append("cerberus_protected")\n',
              '',
          )

          replace_once(
              "src/project_forge_registry/remote_policy.py",
              '    slug_lower = record.slug.lower()\n    local_lower = str(record.local_path).lower()\n\n',
              '',
          )
          replace_once(
              "src/project_forge_registry/remote_policy.py",
              '    if slug_lower == "cerberus" or "cerberus" in slug_lower or "cerberus" in local_lower:\n        reasons.append("cerberus_protected")\n',
              '',
          )
          replace_once(
              "src/project_forge_registry/remote_policy.py",
              '        or item == "cerberus_protected"\n',
              '',
          )

          replace_once(
              "src/project_forge_registry/project_sync.py",
              '    slug_lower = slug.lower()\n    if slug_lower == "cerberus" or "cerberus" in slug_lower:\n        reasons.append("cerberus_protected")\n\n',
              '',
          )
          replace_once(
              "src/project_forge_registry/project_sync.py",
              '        local_path = str(project.get("local_path", "")).lower()\n',
              '',
          )
          replace_once(
              "src/project_forge_registry/project_sync.py",
              '        if "cerberus" in local_path:\n            reasons.append("cerberus_protected")\n',
              '',
          )

          replace_once(
              "src/project_forge_registry/workspace_generation.py",
              '    if "cerberus_special_case_candidate" in record.safety_warnings:\n        reasons.append("safety_warning=cerberus_special_case_candidate")\n',
              '',
          )

          # Normalize stale discovery CSV categories at the dashboard boundary.
          replace_once(
              "src/project_forge_registry/dashboard_inventory.py",
              'from typing import Any\n\n',
              'from typing import Any\n\nfrom .category_policy import normalize_repo_category\n\n',
          )
          replace_once(
              "src/project_forge_registry/dashboard_inventory.py",
              '''        for row in reader:\n            rows.append(\n                RepoDiscoveryRow(\n                    slug=row["slug"],\n                    path=Path(row["path"]),\n                    git_status=row["git_status"],\n                    has_readme=parse_bool(row["has_readme"]),\n                    has_agents=parse_bool(row["has_agents"]),\n                    has_code_workspace=parse_bool(row["has_code_workspace"]),\n                    has_project_forge_marker=parse_bool(\n                        row["has_project_forge_marker"]\n                    ),\n                    remote_count=int(row["remote_count"]),\n                    category=row["category"],\n                )\n            )\n''',
              '''        for row in reader:\n            git_status = row["git_status"]\n            marker = parse_bool(row["has_project_forge_marker"])\n            category = normalize_repo_category(row["category"], git_status, marker)\n            rows.append(\n                RepoDiscoveryRow(\n                    slug=row["slug"],\n                    path=Path(row["path"]),\n                    git_status=git_status,\n                    has_readme=parse_bool(row["has_readme"]),\n                    has_agents=parse_bool(row["has_agents"]),\n                    has_code_workspace=parse_bool(row["has_code_workspace"]),\n                    has_project_forge_marker=marker,\n                    remote_count=int(row["remote_count"]),\n                    category=category,\n                )\n            )\n''',
          )

          replace_method(
              "tests/test_obsidian_mirror_generation.py",
              "test_cerberus_related_records_are_protected",
              '''    def test_cerberus_related_records_are_eligible(self) -> None:\n        plan = self.make_plan([self.make_record("cerberus_helper")])\n\n        self.assertEqual(\n            {entry.record.slug for entry in plan.eligible_entries},\n            {"cerberus_helper"},\n        )''',
          )

          replace_method(
              "tests/test_export_sync.py",
              "test_cerberus_slug_is_protected",
              '''    def test_cerberus_slug_is_eligible(self) -> None:\n        artifacts_root = repository_artifacts_root()\n        with tempfile.TemporaryDirectory(dir=artifacts_root) as artifacts_tmp, tempfile.TemporaryDirectory() as vault_tmp, tempfile.TemporaryDirectory() as project_tmp:\n            artifacts_dir = Path(artifacts_tmp)\n            passport_dir = artifacts_dir / "project_passports"\n            vault_root = Path(vault_tmp)\n            export_docs_dir = vault_root / "cerberus" / "_export" / "docs"\n            passport_dir.mkdir(parents=True)\n            export_docs_dir.mkdir(parents=True)\n            (export_docs_dir / "guide.md").write_text("# Guide\\n", encoding="utf-8")\n\n            write_passport(\n                passport_dir / "cerberus.project.yml",\n                slug="cerberus",\n                local_path=project_tmp,\n            )\n\n            plan = build_sync_plan(\n                mode="dry-run",\n                slug="cerberus",\n                passport_dir=passport_dir,\n                vault_project_root=vault_root,\n                repo_root_override=None,\n                include_files=set(),\n                exclude_files=set(),\n                report_name="export_sync_report.md",\n                backup_suffix="stamp",\n            )\n\n            self.assertTrue(plan.entry.eligible)\n            self.assertEqual(plan.entry.reasons, [])\n            self.assertEqual(plan.files_planned, 1)''',
          )

          replace_method(
              "tests/test_remote_policy.py",
              "test_plan_blocks_cerberus",
              '''    def test_plan_treats_cerberus_normally(self) -> None:\n        with self.temp_in_repo() as tmp:\n            artifacts = Path(tmp)\n            passport_dir = artifacts / "project_passports"\n            passport_dir.mkdir()\n            write_passport(\n                passport_dir / "cerberus.project.yml",\n                slug="cerberus",\n                local_path=str(artifacts),\n            )\n\n            parser = build_parser()\n            args = parser.parse_args(["plan", "--slug", "cerberus", "--passport-dir", str(passport_dir)])\n            plan = build_plan(args)\n\n            self.assertTrue(plan.eligible)\n            self.assertEqual(plan.policy_status, "needs_approval")\n            self.assertNotIn("cerberus_protected", plan.reasons)''',
          )

          replace_method(
              "tests/test_project_sync.py",
              "test_detect_protected_project_from_slug_and_passport",
              '''    def test_detect_protected_project_uses_explicit_policy_only(self) -> None:\n        with tempfile.TemporaryDirectory(dir=repository_root() / "artifacts") as artifacts_tmp:\n            passport_dir = Path(artifacts_tmp) / "project_passports"\n            passport_dir.mkdir(parents=True)\n            passport_path = passport_dir / "cerberus.project.yml"\n            passport_path.write_text(\n                "\\n".join(\n                    [\n                        "project:",\n                        "  slug: cerberus",\n                        '  name: "Cerberus"',\n                        "  category: active_project",\n                        "  status: review",\n                        "  registry_action: register_full",\n                        '  local_path: "/home/cole/cerberus"',\n                        "safety:",\n                        "  warnings: []",\n                        "  do_not_sync: false",\n                        "",\n                    ]\n                ),\n                encoding="utf-8",\n            )\n            reasons = detect_protected_project(passport_path, "cerberus")\n            self.assertEqual(reasons, [])''',
          )

          # Dashboard tests intentionally feed a stale protected category and now
          # assert that the loader normalizes it to a clean candidate.
          p = Path("tests/test_dashboard_inventory.py")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              'self.assertEqual(derive_risk_light(rows["protected"]), "red")',
              'self.assertEqual(derive_risk_light(rows["protected"]), "green")',
          )
          text = text.replace(
              '''        self.assertEqual(\n            derive_recommended_action(rows["protected"]),\n            "protected_manual_review",\n        )''',
              '''        self.assertEqual(\n            derive_recommended_action(rows["protected"]),\n            "candidate_review",\n        )''',
          )
          text = text.replace(
              'self.assertEqual(projects["protected"].launch_policy["status"], "blocked")',
              'self.assertEqual(projects["protected"].launch_policy["status"], "eligible")',
          )
          text = text.replace(
              'self.assertEqual(projects["protected"].review_policy["status"], "manual_only")',
              'self.assertEqual(projects["protected"].review_policy["status"], "not_required")',
          )
          p.write_text(text, encoding="utf-8")
          PY

      - name: Verify no active source uses Cerberus name vetoes
        run: |
          hits="$(rg -l 'cerberus_protected|cerberus_special_case_candidate' src/project_forge_registry | grep -v 'category_policy.py' || true)"
          if [ -n "$hits" ]; then
            echo "Remaining active source vetoes:"
            echo "$hits"
            exit 1
          fi

      - name: Run full unit test suite
        run: PYTHONPATH=src python -m unittest discover -s tests

      - name: Commit verified migration
        run: |
          if git diff --quiet; then
            echo "Migration already applied."
            exit 0
          fi
          git config user.name "Project Forge Migration"
          git config user.email "actions@users.noreply.github.com"
          git add src tests
          git commit -m "refactor: retire remaining Cerberus name-based gates"
          git push origin HEAD:${{ github.head_ref }}
