name: Cerberus policy migration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply one-shot migration
        run: python scripts/cerberus-policy-migration.py

      - name: Verify no active source uses Cerberus name vetoes
        run: |
          hits="$(rg -l 'cerberus_protected|cerberus_special_case_candidate' src/project_forge_registry | grep -v 'category_policy.py' || true)"
          if [ -n "$hits" ]; then
            echo "Remaining active source vetoes:"
            echo "$hits"
            exit 1
          fi

      - name: Run full unit test suite
        run: |
          set +e
          PYTHONPATH=src python -m unittest discover -s tests -f > test-output.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 120 test-output.log
            exit "$status"
          fi
          cat test-output.log

      - name: Upload test failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cerberus-migration-test-output
          path: test-output.log

      - name: Commit verified migration
        run: |
          if git diff --quiet; then
            echo "Migration already applied."
            exit 0
          fi
          git config user.name "Project Forge Migration"
          git config user.email "actions@users.noreply.github.com"
          git add src tests
          git commit -m "refactor: retire remaining Cerberus name-based gates"
          git push origin HEAD:${{ github.head_ref }}
